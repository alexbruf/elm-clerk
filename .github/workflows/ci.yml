name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  elm:
    name: elm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install elm toolchain
        run: bun add -g elm@0.19.1-6 elm-test@0.19.1-revision17 elm-format@0.8.8 elm-review@2.13.5

      - name: Cache elm-stuff
        uses: actions/cache@v4
        with:
          path: |
            elm-stuff
            example/elm-stuff
            ~/.elm
          key: ${{ runner.os }}-elm-${{ hashFiles('elm.json', 'example/elm.json') }}
          restore-keys: |
            ${{ runner.os }}-elm-

      - name: elm-format --validate
        run: elm-format --validate src tests

      - name: elm-review
        run: elm-review

      - name: elm-test
        run: elm-test

      - name: Shared fixtures are in sync (fixtures/*.json -> tests/Fixtures.elm)
        run: |
          node scripts/gen-fixtures.mjs
          elm-format --yes tests/Fixtures.elm
          git diff --exit-code -- tests/Fixtures.elm

      - name: No port declarations in the package
        run: |
          if grep -rn '^port ' src; then
            echo "::error::port declarations are forbidden under src/ (Elm package registry rejects them)"
            exit 1
          fi

  js:
    name: js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run --cwd js typecheck

      - name: Build
        run: bun run --cwd js build

      - name: Test
        run: bun run --cwd js test

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    needs: [elm, js]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check coverage.json agrees with code
        run: node scripts/check-coverage.mjs

      - name: Check README doc-driven samples
        run: node scripts/check-readme.mjs

  example:
    name: example
    runs-on: ubuntu-latest
    needs: [js]
    # The Playwright smoke test signs in as one shared Clerk test user, so
    # two runs at once race each other. Serialize across the whole repo.
    concurrency:
      group: clerk-e2e
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install elm toolchain
        run: bun add -g elm@0.19.1-6

      - name: Cache elm-stuff
        uses: actions/cache@v4
        with:
          path: |
            elm-stuff
            example/elm-stuff
            ~/.elm
          key: ${{ runner.os }}-elm-${{ hashFiles('elm.json', 'example/elm.json') }}
          restore-keys: |
            ${{ runner.os }}-elm-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build js shim
        run: bun run --cwd js build

      - name: Build example
        run: bun run --cwd example build

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Run e2e smoke test
        working-directory: example
        run: bun run test:e2e
        env:
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: example/playwright-report
          retention-days: 7
