name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag is on main
        run: |
          git fetch origin main --quiet
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::tag ${GITHUB_REF_NAME} is not on main"
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - name: Install elm toolchain
        run: bun add -g elm@0.19.1-6

      - name: Verify versions agree with the tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          ELM_VERSION=$(node -p "require('./elm/elm.json').version")
          JS_VERSION=$(node -p "require('./js/package.json').version")

          echo "tag: ${TAG_VERSION}, elm/elm.json: ${ELM_VERSION}, js/package.json: ${JS_VERSION}"

          if [ "${TAG_VERSION}" != "${ELM_VERSION}" ] || [ "${TAG_VERSION}" != "${JS_VERSION}" ]; then
            echo "::error::version mismatch: tag=${TAG_VERSION} elm/elm.json=${ELM_VERSION} js/package.json=${JS_VERSION}"
            exit 1
          fi

      - name: Install dependencies
        run: bun install

      - name: Build js shim
        run: bun run --cwd js build

      # `elm publish` looks for a bare `X.Y.Z` tag on GitHub, while this
      # workflow triggers on `vX.Y.Z`. Mirror the tag onto the same commit.
      - name: Mirror vX.Y.Z tag as X.Y.Z for the Elm registry
        run: |
          BARE="${GITHUB_REF_NAME#v}"
          git tag -f -a "${BARE}" "${GITHUB_SHA}" -m "elm-clerk ${BARE}"
          git push -f origin "refs/tags/${BARE}"

      - name: elm publish
        working-directory: elm
        run: elm publish
        env:
          # elm publish needs the tag to already exist on origin, which the
          # `push: tags` trigger guarantees.
          NO_COLOR: "1"

      # npm trusted publishing (OIDC): no NPM_TOKEN secret. Needs the
      # `id-token: write` permission above, npm >= 11.5.1, and a trusted
      # publisher configured on npmjs.com for @viewengine/elm-clerk pointing
      # at alexbruf/elm-clerk + release.yml. Provenance is attached
      # automatically. bun publish does not support OIDC, hence npm here.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest && npm --version

      - name: npm publish (trusted publishing)
        working-directory: js
        # Idempotent: a version already on the registry (e.g. 1.0.0, which
        # was published by hand to bootstrap trusted publishing) is skipped.
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "${NAME}@${VERSION} already published, skipping"
          else
            npm publish --access public
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            coverage.json
